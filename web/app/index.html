<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survey preview (QA harness)</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:1rem auto;padding:0 1rem}
.q{margin:1rem 0}.q[hidden]{display:none}label{display:block;font-weight:600;margin-bottom:.25rem}
input,select{font-size:1.1rem;padding:.6rem;min-height:48px;width:100%;box-sizing:border-box}
.err{color:#b00020}.hfc{background:#fff4cc;padding:.5rem;margin-top:.25rem}button{min-height:48px;font-size:1.1rem;padding:0 1.2rem}
pre{background:#f4f4f4;padding:.5rem;overflow:auto}</style></head>
<body>
<h1 id="survey-title"></h1>
<form id="form" novalidate></form>
<button id="submit" type="button">Submit</button>
<pre id="output" data-testid="output" aria-live="polite"></pre>
<script src="engine.js"></script>
<script src="app.js"></script>
</body></html>
